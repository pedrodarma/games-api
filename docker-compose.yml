version: '3.8'

services:
  app:
    image: ghcr.io/pedrodarma/games-api:main
    container_name: games-api
    environment:
      - NODE_ENV=production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-1118}
      - REDIS_USERNAME=${REDIS_USERNAME:-admin}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-default}
    restart: unless-stopped # options: always, unless-stopped, on-failure
    ports:
      - '8060:8060' # Expose port 8060 on the host
    networks:
      default_bridge:
        ipv4_address: 172.250.0.11

networks:
  default_bridge:
    external: true
    name: games-network # Use the default bridge network driver
